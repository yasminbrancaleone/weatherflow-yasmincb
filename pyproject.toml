[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherflow"
version = "0.2.0"
dependencies = [
    "PyYAML>=6.0",
    "pyarrow>=14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weatherflow = ["reference/*.csv"]
