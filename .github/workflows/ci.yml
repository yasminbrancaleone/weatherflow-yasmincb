name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: weatherflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d weatherflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/weatherflow_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Install WeatherFlow
        run: python -m pip install -e .
      - name: Run tests with coverage gate
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=70
